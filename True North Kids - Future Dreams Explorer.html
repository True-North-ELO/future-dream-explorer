  <script>
    const questions = [
      {
        id: "activity",
        prompt: "What sounds the most fun to you?",
        options: [
          { label: "Building or fixing things", tags: ["builder", "engineer"] },
          { label: "Drawing, making videos, or creating art", tags: ["creative", "artist"] },
          { label: "Helping people feel better", tags: ["helper", "health"] },
          { label: "Solving puzzles or tricky problems", tags: ["problem", "science"] },
        ],
      },
      {
        id: "school",
        prompt: "Which school activity do you like best?",
        options: [
          { label: "Science experiments", tags: ["science", "engineer"] },
          { label: "Reading and writing stories", tags: ["creative", "communicator"] },
          { label: "Math games", tags: ["problem", "engineer"] },
          { label: "Working in groups", tags: ["helper", "communicator"] },

      },
      {
        id: "superpower",
        prompt: "Which superpower feels most like you?",
        options: [
          { label: "Inventing cool things", tags: ["engineer", "science"] },
          { label: "Making people smile", tags: ["helper", "communicator"] },
          { label: "Thinking of awesome ideas", tags: ["creative", "artist"] },
          { label: "Figuring things out fast", tags: ["problem", "science"] },
        ],
      },
      {
        id: "weekend",
        prompt: "What would be the best weekend project?",
        options: [
          { label: "Build a treehouse or robot", tags: ["builder", "engineer"] },
          { label: "Make a comic book or song", tags: ["creative", "artist"] },
          { label: "Take care of animals or people", tags: ["helper", "health"] },
          { label: "Run a lemonade stand or team project", tags: ["leader", "communicator"] },
        ],
      },
      {
        id: "dream",
        prompt: "Pick the place you would most want to work someday.",
        options: [
          { label: "A lab, workshop, or building site", tags: ["science", "builder", "engineer"] },
          { label: "A studio, stage, or design room", tags: ["creative", "artist"] },
          { label: "A hospital, school, or community center", tags: ["helper", "health"] },
          { label: "An office where big ideas happen", tags: ["leader", "communicator", "problem"] },
        ],
      },
      {
        id: "team",
        prompt: "What role do you usually play in a group?",
        options: [
          { label: "I build or figure things out", tags: ["builder", "problem"] },
          { label: "I come up with creative ideas", tags: ["creative", "artist"] },
          { label: "I help people and keep everyone happy", tags: ["helper", "communicator"] },
          { label: "I lead the group and organize things", tags: ["leader", "communicator"] },
        ],
      },
    ];

    const careers = [
      {
        name: "Engineer",
        emoji: "⚙️",
        tags: ["engineer", "builder", "problem"],
        why: "You like building, inventing, and solving problems.",
        tryNow: ["Build something with blocks or Lego", "Try a simple coding game", "Take apart an old gadget with an adult"],
      },
      {
        name: "Artist or Designer",
        emoji: "🎨",
        tags: ["creative", "artist"],
        why: "You enjoy making things that are original, colorful, and fun.",
        tryNow: ["Create a poster", "Design a dream bedroom", "Make a comic strip or short video"],
      },
      {
        name: "Doctor, Nurse, or Care Helper",
        emoji: "🩺",
        tags: ["helper", "health"],
        why: "You care about people and want to help them feel better.",
        tryNow: ["Learn basic first aid with an adult", "Read about the human body", "Help care for a pet or younger child"],
      },
      {
        name: "Scientist",
        emoji: "🔬",
        tags: ["science", "problem"],
        why: "You are curious and like asking questions about how things work.",
        tryNow: ["Do a kitchen science experiment", "Start a nature journal", "Watch a science video and explain it to someone"],
      },
      {
        name: "Teacher or Coach",
        emoji: "📚",
        tags: ["helper", "communicator", "leader"],
        why: "You like helping others learn and cheering them on.",
        tryNow: ["Teach a sibling a game", "Explain your favorite subject", "Help a friend practice something"],
      },
      {
        name: "Writer, Speaker, or Media Creator",
        emoji: "🎤",
        tags: ["creative", "communicator"],
        why: "You enjoy telling stories, sharing ideas, and expressing yourself.",
        tryNow: ["Record a pretend podcast", "Write a short story", "Interview a family member"],
      },
      {
        name: "Business Leader or Entrepreneur",
        emoji: "💡",
        tags: ["leader", "communicator", "problem"],
        why: "You like big ideas, teamwork, and finding ways to make things better.",
        tryNow: ["Start a mini business idea", "Plan an event for your family", "Think of a product that solves a problem"],
      },
    ];

    let answers = {};
    let started = false;
    let showResults = false;

    function computeTopMatches() {
      const score = {};
      careers.forEach((career) => {
        score[career.name] = 0;
        Object.values(answers).forEach((answer) => {
          answer.tags.forEach((tag) => {
            if (career.tags.includes(tag)) score[career.name] += 1;
          });
        });
      });

      return careers
        .map((career) => ({ ...career, score: score[career.name] || 0 }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 3);
    }

    function resetQuiz() {
      answers = {};
      started = false;
      showResults = false;
      render();
    }

    function answerQuestion(questionId, optionIndex) {
      answers[questionId] = questions.find(q => q.id === questionId).options[optionIndex];
      render();
    }

    function render() {
      const app = document.getElementById("app");
      const answeredCount = Object.keys(answers).length;
      const progress = Math.round((answeredCount / questions.length) * 100);
      const topMatches = computeTopMatches();

      app.innerHTML = `

                </p>
              </div>
              <div class="rounded-3xl bg-gradient-to-br from-yellow-200 to-pink-200 px-6 py-5 text-center shadow-md">
                <div class="text-5xl">🚀</div>
                <p class="mt-2 text-sm font-bold text-slate-700">No pressure. Just explore.</p>
              </div>
            </div>
          </div>

          ${!started ? `
            <div class="grid gap-6 md:grid-cols-3">
              <div class="md:col-span-2 rounded-3xl bg-white p-8 shadow-lg ring-1 ring-slate-200">
                <h3 class="text-2xl font-bold text-slate-900">How it works</h3>
                <div class="mt-5 grid gap-4 md:grid-cols-3">
                  <div class="rounded-2xl bg-sky-50 p-4">
                    <div class="text-3xl">1️⃣</div>
                    <p class="mt-2 font-semibold">Answer fun questions</p>
                    <p class="mt-1 text-sm text-slate-600">Pick the choices that feel most like you.</p>
                  </div>
                  <div class="rounded-2xl bg-violet-50 p-4">
                    <div class="text-3xl">2️⃣</div>
                    <p class="mt-2 font-semibold">See your top matches</p>
                    <p class="mt-1 text-sm text-slate-600">Discover jobs connected to your interests.</p>
                  </div>
                  <div class="rounded-2xl bg-emerald-50 p-4">
                    <div class="text-3xl">3️⃣</div>
                    <p class="mt-2 font-semibold">Try mini adventures</p>
                    <p class="mt-1 text-sm text-slate-600">Practice activities that help you learn more.</p>
                  </div>
                </div>
                <button id="startBtn" class="mt-6 rounded-2xl bg-slate-900 px-6 py-3 text-lg font-bold text-white shadow-lg transition hover:scale-[1.02]">
                  Start Exploring
                </button>
              </div>

              <div class="rounded-3xl bg-white p-6 shadow-lg ring-1 ring-slate-200">
                <h3 class="text-xl font-bold">Important note</h3>
                <p class="mt-3 text-sm leading-6 text-slate-600">
                  This app does not tell you your whole future. It helps you notice what you like now, so you can try new things and keep learning.
                </p>
                <div class="mt-5 rounded-2xl bg-amber-50 p-4 text-sm text-amber-900">
                  Best message: you do not have to decide everything at age 10.
                </div>
              </div>
            </div>

              <div class="rounded-3xl bg-white p-8 shadow-lg ring-1 ring-slate-200">
                <div class="mb-6">

                            <button data-question="${question.id}" data-option="${oIndex}" class="answer-btn rounded-2xl border px-4 py-4 text-left text-sm font-semibold transition ${
                              isSelected
                                ? "border-violet-500 bg-violet-50 text-violet-900 shadow"
                                : "border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50"
                            }">
                              ${option.label}
                            </button>
                          `;
                        }).join("")}
                      </div>
                    </div>
                  `).join("")}
                </div>

                <div class="mt-6 flex flex-wrap gap-3">
                  <button id="resultsBtn" class="rounded-2xl px-6 py-3 font-bold text-white shadow transition ${answeredCount < questions.length ? "cursor-not-allowed bg-slate-300" : "bg-slate-900 hover:scale-[1.02]"}" ${answeredCount < questions.length ? "disabled" : ""}>
                    See My Matches
                  </button>
                  <button id="resetBtn" class="rounded-2xl bg-slate-100 px-6 py-3 font-bold text-slate-700 transition hover:bg-slate-200">
                    Start Over
                  </button>
                </div>
              </div>

              <div class="space-y-6">
                <div class="rounded-3xl bg-white p-6 shadow-lg ring-1 ring-slate-200">
                  <h3 class="text-xl font-bold">What this app looks for</h3>
                  <div class="mt-4 grid gap-3">
                    ${[["🎯", "What you enjoy"], ["🧠", "How you think"], ["🤝", "How you help others"], ["✨", "What excites you"]].map(([emoji, label]) => `
                      <div class="flex items-center gap-3 rounded-2xl bg-slate-50 p-3">
                        <div class="text-2xl">${emoji}</div>
                        <p class="font-semibold text-slate-700">${label}</p>
                      </div>
                    `).join("")}
                  </div>
                </div>

                <div class="rounded-3xl bg-gradient-to-br from-violet-500 to-sky-500 p-6 text-white shadow-lg">
                  <h3 class="text-xl font-bold">Reminder</h3>
                  <p class="mt-3 text-sm leading-6 text-violet-50">
                    Grown-ups change jobs all the time. You are just getting started, and every hobby can teach you something useful.
                  </p>
                </div>
              </div>
            </div>
          ` : `
            <div class="space-y-6">
              <div class="rounded-3xl bg-white p-8 shadow-lg ring-1 ring-slate-200">
                <h3 class="text-3xl font-black text-slate-900">Your top future job matches</h3>
                <p class="mt-2 text-slate-600">These are not forever choices. They are smart ideas to explore next.</p>
              </div>

              <div class="grid gap-6 lg:grid-cols-3">
                ${topMatches.map((career, index) => `
                  <div class="rounded-3xl p-6 shadow-lg ring-1 ${index === 0 ? "bg-gradient-to-b from-yellow-50 to-white ring-yellow-300" : "bg-white ring-slate-200"}">
                    <div class="flex items-center justify-between">
                      <div class="text-5xl">${career.emoji}</div>
                      <div class="rounded-full bg-slate-900 px-3 py-1 text-sm font-bold text-white">Score ${career.score}</div>
                    </div>
                    <h4 class="mt-4 text-2xl font-bold text-slate-900">${career.name}</h4>
                    <p class="mt-3 text-slate-600">${career.why}</p>
                    <div class="mt-5 rounded-2xl bg-slate-50 p-4">
                      <p class="text-sm font-bold uppercase tracking-wide text-slate-500">Try this next</p>
                      <ul class="mt-3 space-y-2 text-sm text-slate-700">
                        ${career.tryNow.map(item => `<li class="flex gap-2"><span>⭐</span><span>${item}</span></li>`).join("")}
                      </ul>
                    </div>
                  </div>
                `).join("")}
              </div>

              <div class="grid gap-6 md:grid-cols-2">
                <div class="rounded-3xl bg-white p-6 shadow-lg ring-1 ring-slate-200">
                  <h3 class="text-xl font-bold">Questions to ask a grown-up</h3>
                  <ul class="mt-4 space-y-3 text-slate-700">
                    <li>• What jobs fit the things I like to do?</li>
                    <li>• What can I try now at school or at home?</li>
                    <li>• Who do we know that does a job like this?</li>
                    <li>• Can I visit a workplace or watch someone do that job?</li>
                  </ul>
                </div>

                <div class="rounded-3xl bg-white p-6 shadow-lg ring-1 ring-slate-200">
                  <h3 class="text-xl font-bold">Keep exploring</h3>
                  <p class="mt-3 text-slate-600">
                    Your interests can grow and change. The best plan is to stay curious, try things, and notice what makes you excited.
                  </p>
                  <div class="mt-5 flex flex-wrap gap-3">
                    <button id="backBtn" class="rounded-2xl bg-slate-900 px-5 py-3 font-bold text-white">Back to Quiz</button>
                    <button id="resetBtn" class="rounded-2xl bg-slate-100 px-5 py-3 font-bold text-slate-700">Start Again</button>
                  </div>
                </div>
              </div>
            </div>
          `}
        </div>
      `;

      const startBtn = document.getElementById("startBtn");
      if (startBtn) {
        startBtn.addEventListener("click", () => {
          started = true;
          render();
        });
      }

      document.querySelectorAll(".answer-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const questionId = e.currentTarget.dataset.question;
          const optionIndex = Number(e.currentTarget.dataset.option);
          answerQuestion(questionId, optionIndex);
        });
      });

      const resultsBtn = document.getElementById("resultsBtn");
      if (resultsBtn) {
        resultsBtn.addEventListener("click", () => {
          if (Object.keys(answers).length === questions.length) {
            showResults = true;
            render();
          }
        });
      }

      const backBtn = document.getElementById("backBtn");
      if (backBtn) {
        backBtn.addEventListener("click", () => {
          showResults = false;
          render();
        });
      }

      document.querySelectorAll("#resetBtn").forEach(btn => {
        btn.addEventListener("click", resetQuiz);
      });
    }

    render();
  </script>
</body>
</html>
