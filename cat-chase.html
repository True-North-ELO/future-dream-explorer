<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cat Chase!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #a0f0ff;
      text-shadow: 0 0 10px #00cfff;
    }
    #hud {
      display: flex;
      gap: 30px;
      margin-bottom: 8px;
      font-size: 1rem;
    }
    #score-display { color: #ffe066; }
    #lives-display { color: #ff6688; }
    canvas {
      border: 2px solid #333;
      border-radius: 6px;
      background: #111122;
      display: block;
    }
    #overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      background: rgba(0,0,0,0.95);
      width: min(600px, 96vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 18px 20px;
      border-radius: 8px;
      z-index: 10;
    }
    #overlay h2 { font-size: 2rem; color: #a0f0ff; }
    #overlay p  { font-size: 0.9rem; color: #ccc; text-align: center; max-width: 440px; }
    #overlay #startBtn {
      padding: 10px 34px; font-size: 1rem;
      background: #1a8cff; color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
    }
    #overlay #startBtn:hover { background: #0070dd; }
    .cat-btn {
      padding: 8px 22px; font-size: 0.95rem;
      background: #16162e; color: #aac;
      border: 2px solid #334; border-radius: 8px; cursor: pointer;
      transition: border-color .12s, background .12s;
    }
    .cat-btn:hover { border-color: #66a; }
    .cat-btn.active { background: #162a50; border-color: #4af; color: #fff; }
    /* Cat picker cards */
    #cat-picker {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 8px; width: 100%;
    }
    .cat-card {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: #10102a; border: 2px solid #2a2a55;
      border-radius: 10px; padding: 8px 10px; cursor: pointer;
      transition: border-color .12s, background .12s;
      width: 88px;
    }
    .cat-card:hover { border-color: #558; background: #14143a; }
    .cat-card.active { border-color: #4af; background: #162a50; }
    .cat-card canvas { border-radius: 4px; background: #1a1a30; display:block; }
    .cat-card span { font-size: 0.7rem; color: #aac; text-align: center; line-height: 1.2; }
  </style>
</head>
<body>
<h1>🐱 Cat Chase!</h1>
<div id="hud">
  <span id="score-display">Score: 0</span>
  <span id="lives-display">Lives: ♥♥♥</span>
</div>
<div style="position:relative;">
  <canvas id="game" width="600" height="300"></canvas>
  <div id="overlay">
    <h2>Cat Chase!</h2>
    <p style="margin-bottom:2px">Pick your cat:</p>
    <div id="cat-picker"></div>
    <p style="margin-top:2px">↑ / Space to jump &nbsp;·&nbsp; Stomp enemies for a boost &nbsp;·&nbsp; Dodge bullets!</p>
    <button id="startBtn">Start Game</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const overlay    = document.getElementById('overlay');
const startBtn   = document.getElementById('startBtn');
const scoreEl    = document.getElementById('score-display');
const livesEl    = document.getElementById('lives-display');

const W = canvas.width, H = canvas.height;
const GROUND = H - 50;

// ─── State ──────────────────────────────────────────────────────────────────
let state, score, lives, raf;
let stars = [];
let speedLevel = 0, speedTick = 0, speedPopup = 0;
let catType = 'calico'; // 'calico' | 'black' | 'orange'

// ─── Collectibles ─────────────────────────────────────────────────────────────
// type: 'heart' | 'star' | 'shield'
let collectibles = [];
let collectSpawnTimer = 0;
let collectPopup = '';  // text shown on pickup
let collectPopupTimer = 0;

// ─── UFO Abduction state ─────────────────────────────────────────────────────
const UFO_STATE = { NONE:0, ARRIVE:1, BEAM:2, RISE:3, HOLD:4, DROP:5 };
let ufo = {
  phase: UFO_STATE.NONE,
  x: W + 60, y: 30, vy: 0,
  tick: 0,
  catHeld: false,      // cat is inside UFO during HOLD
  savedCatX: 0,
};
function resetUfo() {
  ufo.phase = UFO_STATE.NONE;
  ufo.x = W + 60; ufo.y = 30; ufo.vy = 0; ufo.tick = 0; ufo.catHeld = false;
}

function attachCatListeners() {
  const picker = document.getElementById('cat-picker');
  if (!picker) return;
  picker.innerHTML = '';
  CAT_ORDER.forEach(type => {
    const scheme = CAT_SCHEMES[type];
    const card = document.createElement('div');
    card.className = 'cat-card' + (type === catType ? ' active' : '');
    card.dataset.cat = type;

    // Mini preview canvas
    const pc = document.createElement('canvas');
    pc.width = 68; pc.height = 60;
    const pCtx = pc.getContext('2d');
    // Dark bg
    pCtx.fillStyle = '#1a1a30';
    pCtx.fillRect(0, 0, 68, 60);
    // Draw cat sprite into preview using main drawCat but redirected to pCtx
    // We temporarily swap ctx, draw, then restore
    const realCtx = ctx;
    // Draw via an offscreen approach: copy drawCat logic inline scaled to fit
    drawCatOn(pCtx, 14, 14, type);

    const label = document.createElement('span');
    label.textContent = scheme.label.replace('\\n', '\n');

    card.appendChild(pc);
    card.appendChild(label);
    card.addEventListener('click', () => {
      document.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      catType = type;
    });
    picker.appendChild(card);
  });
}
// NOTE: attachCatListeners() is called after CAT_ORDER/CAT_SCHEMES/drawCatOn are defined below.

// ─── Cat ────────────────────────────────────────────────────────────────────
const cat = {
  x: 90, y: GROUND, w: 38, h: 38,
  vy: 0, jumping: false, stunTimer: 0, jumpsLeft: 2,
  frame: 0, frameTick: 0, prevY: GROUND,
  reset() {
    this.y = GROUND; this.prevY = GROUND; this.vy = 0;
    this.jumping = false; this.jumpsLeft = 2; this.stunTimer = 0;
  }
};

// ─── Enemies ─────────────────────────────────────────────────────────────────
const alien = {
  x: W + 80, y: GROUND, w: 40, h: 48,
  speed: 1.8, stunTimer: 0, frame: 0, frameTick: 0,
  reset() { this.x = W + 80; this.y = GROUND; this.stunTimer = 0; }
};
const moth = {
  x: W + 250, y: GROUND - 40, w: 44, h: 40,
  speed: 1.4, stunTimer: 0, frame: 0, frameTick: 0,
  amplitude: 40, angle: 0,
  reset() { this.x = W + 250; this.stunTimer = 0; this.angle = 0; }
};

// ─── Projectiles (alien shoots) ───────────────────────────────────────────────
let bullets = [];
let bulletCooldown = 0;

// ─── Stars ───────────────────────────────────────────────────────────────────
function makeStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*(H-60), r: Math.random()*1.5+0.3, s: Math.random()*0.4+0.1 });
  }
}

// ─── Input ───────────────────────────────────────────────────────────────────
let jumpPressed = false;
document.addEventListener('keydown', e => {
  if ((e.code === 'ArrowUp' || e.code === 'Space') && state === 'playing') {
    e.preventDefault();
    jumpPressed = true;
  }
});
document.addEventListener('touchstart', () => { jumpPressed = true; });

// ─── Start / Restart ─────────────────────────────────────────────────────────
startBtn.addEventListener('click', startGame);

function startGame() {
  overlay.style.display = 'none';
  score = 0; lives = 3; state = 'playing';
  speedLevel = 0; speedTick = 0; speedPopup = 0;
  collectibles = []; collectSpawnTimer = 0; collectPopup = ''; collectPopupTimer = 0;
  resetUfo();
  cat.reset(); alien.reset(); moth.reset();
  bullets = []; bulletCooldown = 0;
  makeStars();
  if (raf) cancelAnimationFrame(raf);
  loop();
}

// ─── Physics helpers ─────────────────────────────────────────────────────────
const GRAVITY = 0.38, JUMP_V = -13;

function tryJump() {
  if (cat.jumpsLeft > 0) {
    cat.vy = JUMP_V;
    cat.jumping = true;
    cat.jumpsLeft--;
  }
}

// ─── Collision (AABB with shrink) ────────────────────────────────────────────
function overlaps(a, b, shrink = 8) {
  return a.x + shrink < b.x + b.w - shrink &&
         a.x + a.w - shrink > b.x + shrink &&
         a.y + shrink < b.y + b.h - shrink &&
         a.y + a.h - shrink > b.y + shrink;
}

// Stomp = bounce boost, no life lost. Side/body = pass through, lose a life.
// prevY lets us reliably tell which direction the cat came from.
function resolveEnemy(enemy) {
  if (!overlaps(cat, enemy, 6)) return;

  const prevBottom = cat.prevY + cat.h;   // cat feet position LAST frame
  const enemyTop   = enemy.y + 10;        // top zone of enemy

  if (cat.vy > 0.5 && prevBottom <= enemyTop) {
    // ── Stomp from above — bounce, no damage ──
    cat.vy = -14;                          // strong jump boost
    cat.jumping = true;
    cat.jumpsLeft = 1;                     // still has one more jump available
  } else if (cat.stunTimer === 0) {
    // ── Side / body hit — pass through, lose a life ──
    hitCat();
  }
}

// ─── Update ──────────────────────────────────────────────────────────────────
function update() {
  score++;

  // Jump input
  if (jumpPressed) { tryJump(); jumpPressed = false; }

  // Cat physics
  cat.prevY = cat.y;          // snapshot position before movement
  cat.vy += GRAVITY;
  cat.y  += cat.vy;
  if (cat.y >= GROUND) { cat.y = GROUND; cat.vy = 0; cat.jumping = false; cat.jumpsLeft = 2; }
  if (cat.stunTimer > 0) cat.stunTimer--;

  // Cat animation frame
  cat.frameTick++;
  if (cat.frameTick > 8) { cat.frame = (cat.frame + 1) % 2; cat.frameTick = 0; }

  // Speed ramp — increases every 10 seconds (600 ticks)
  speedTick++;
  if (speedTick >= 600) { speedTick = 0; speedLevel++; speedPopup = 120; }
  if (speedPopup > 0) speedPopup--;
  const ramp = 1 + speedLevel * 0.2;

  // Alien movement — ground only
  if (alien.stunTimer > 0) {
    alien.stunTimer--;
  } else {
    alien.x -= alien.speed * ramp;
    alien.y = GROUND;
    alien.frameTick++;
    if (alien.frameTick > 10) { alien.frame = (alien.frame+1)%2; alien.frameTick=0; }
  }
  // Wrap alien
  if (alien.x < -alien.w) alien.x = W + 60 + Math.random() * 120;

  // Moth movement (sinusoidal)
  if (moth.stunTimer > 0) {
    moth.stunTimer--;
  } else {
    moth.x -= moth.speed * ramp;
    moth.angle += 0.06;
    moth.y = (GROUND - 55) + Math.sin(moth.angle) * moth.amplitude;
    moth.frameTick++;
    if (moth.frameTick > 5) { moth.frame = (moth.frame+1)%2; moth.frameTick=0; }
  }
  if (moth.x < -moth.w) moth.x = W + 150 + Math.random() * 200;

  // Bullets
  bulletCooldown--;
  if (bulletCooldown <= 0 && alien.x < W - 20 && alien.stunTimer === 0) {
    bullets.push({ x: alien.x, y: alien.y + 18, w: 10, h: 6, speed: 3.5 * ramp });
    bulletCooldown = 120 + Math.floor(Math.random() * 80);
  }
  bullets.forEach(b => b.x -= b.speed);
  bullets = bullets.filter(b => b.x > -20);

  // ── Enemy collisions ──
  resolveEnemy(alien);
  resolveEnemy(moth);

  // ── Collision: cat vs bullets ──
  bullets.forEach((b, i) => {
    if (cat.stunTimer === 0 &&
        cat.x < b.x + b.w && cat.x + cat.w > b.x &&
        cat.y < b.y + b.h && cat.y + cat.h > b.y) {
      bullets.splice(i, 1);
      hitCat();
    }
  });

  // Stars parallax
  stars.forEach(s => { s.x -= s.s; if (s.x < 0) s.x = W; });

  // ── Collectibles: spawn ──
  collectSpawnTimer--;
  if (collectSpawnTimer <= 0) {
    const types = ['heart', 'star', 'star', 'shield', 'ufo']; // ufo is rare
    const type  = types[Math.floor(Math.random() * types.length)];
    // hearts and shields spawn at ground level or floating; stars float at random heights
    const floatY = type === 'star'
      ? GROUND - 20 - Math.random() * 100
      : type === 'ufo'
      ? GROUND - 20
      : GROUND - 10;
    collectibles.push({ type, x: W + 10, y: floatY, w: 22, h: 22, bob: Math.random() * Math.PI * 2 });
    collectSpawnTimer = 280 + Math.floor(Math.random() * 200);
  }

  // ── Collectibles: move & collect ──
  const cRamp = 1 + speedLevel * 0.2;
  for (let i = collectibles.length - 1; i >= 0; i--) {
    const c = collectibles[i];
    c.x -= 2.2 * cRamp;
    c.bob += 0.07;
    // bobbing offset used during draw only
    if (c.x < -c.w) { collectibles.splice(i, 1); continue; }
    // collect check (generous hitbox)
    if (cat.x + 6 < c.x + c.w && cat.x + cat.w - 6 > c.x &&
        cat.y + 6 < c.y + c.h + 8 && cat.y + cat.h - 6 > c.y - 8) {
      collectibles.splice(i, 1);
      if (c.type === 'heart') {
        lives = Math.min(lives + 1, 5);
        collectPopup = '+1 ♥'; collectPopupTimer = 90;
      } else if (c.type === 'star') {
        score += 200;
        collectPopup = '+200!'; collectPopupTimer = 90;
      } else if (c.type === 'shield') {
        cat.stunTimer = Math.max(cat.stunTimer, 300); // 5s shield
        collectPopup = 'SHIELD!'; collectPopupTimer = 90;
      } else if (c.type === 'ufo' && ufo.phase === UFO_STATE.NONE) {
        // Trigger abduction sequence
        ufo.phase = UFO_STATE.ARRIVE;
        ufo.x = W + 60; ufo.y = -40; ufo.tick = 0;
        ufo.savedCatX = cat.x;
      }
    }
  }
  if (collectPopupTimer > 0) collectPopupTimer--;

  // ── UFO abduction sequence ──
  updateUfo();

  updateHUD();
}

function hitCat() {
  lives--;
  cat.stunTimer = 120; // longer invincibility
  cat.vy = -7;
  if (lives <= 0) gameOver();
}

function updateHUD() {
  scoreEl.textContent = 'Score: ' + score;
  livesEl.textContent = 'Lives: ' + '♥'.repeat(Math.max(0, lives)) + '  Speed Lv.' + (speedLevel + 1);
}

function updateUfo() {
  if (ufo.phase === UFO_STATE.NONE) return;
  ufo.tick++;

  if (ufo.phase === UFO_STATE.ARRIVE) {
    // UFO slides in from right to above the cat
    const targetX = cat.x - 10;
    ufo.x += (targetX - ufo.x) * 0.06;
    ufo.y += (40 - ufo.y) * 0.07;
    if (ufo.tick > 80) { ufo.phase = UFO_STATE.BEAM; ufo.tick = 0; }

  } else if (ufo.phase === UFO_STATE.BEAM) {
    // Tractor beam visible, cat rises
    cat.y -= 3;
    cat.vy = 0;
    cat.jumping = true;
    ufo.x += (cat.x - 10 - ufo.x) * 0.08;
    if (cat.y <= ufo.y + 44) {
      ufo.phase = UFO_STATE.HOLD; ufo.tick = 0;
      ufo.catHeld = true;
    }

  } else if (ufo.phase === UFO_STATE.HOLD) {
    // UFO zooms off-screen to the right holding the cat
    ufo.x += 14;
    cat.x = ufo.x + 10;
    cat.y = ufo.y + 44;
    if (ufo.tick > 40) {
      // award points, drop cat safely away from enemies
      score += 1000;
      collectPopup = '+1000! 🛸'; collectPopupTimer = 120;
      // Pick a landing X that is at least 80px clear of both enemies
      let landX = 90;
      const clearOf = (ex) => Math.abs(landX - ex) >= 80;
      if (!clearOf(alien.x) || !clearOf(moth.x)) landX = 60;
      cat.x = landX;
      cat.y = GROUND;
      cat.vy = 0; cat.jumping = false; cat.jumpsLeft = 2;
      cat.stunTimer = 180; // 3 s invincibility so landing is always safe
      ufo.catHeld = false;
      ufo.phase = UFO_STATE.DROP; ufo.tick = 0;
      // UFO re-enters from right to exit left
      ufo.x = W + 80; ufo.y = 30;
    }

  } else if (ufo.phase === UFO_STATE.DROP) {
    // UFO flies off to the left and disappears
    ufo.x -= 10;
    if (ufo.x < -100) resetUfo();
  }
}

// ─── Draw ────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#07071a');
  grad.addColorStop(1, '#1a1a3a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = '#ffffff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now()/600 + s.x);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Ground
  ctx.fillStyle = '#2a2a50';
  ctx.fillRect(0, GROUND + 38, W, H);
  ctx.fillStyle = '#3a3a70';
  ctx.fillRect(0, GROUND + 38, W, 4);

  // Bullets
  bullets.forEach(b => {
    ctx.fillStyle = '#00ff99';
    ctx.shadowColor = '#00ff99';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur = 0;
  });

  // Cat
  drawCat(cat.x, cat.y, cat.frame, cat.stunTimer > 0);

  // Alien
  drawAlien(alien.x, alien.y, alien.frame, alien.stunTimer > 0);

  // Mothman
  drawMothman(moth.x, moth.y, moth.frame, moth.stunTimer > 0);

  // Collectibles
  collectibles.forEach(c => drawCollectible(c));

  // UFO (during abduction)
  if (ufo.phase !== UFO_STATE.NONE) drawUfo(ufo.x, ufo.y, ufo.phase);

  // Speed-up popup
  if (speedPopup > 0) {
    const alpha = speedPopup > 60 ? 1 : speedPopup / 60;
    const scale = 1 + (1 - speedPopup / 120) * 0.4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, H / 2 - 30);
    ctx.scale(scale, scale);
    ctx.font = 'bold 32px Segoe UI';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4400';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffaa00';
    ctx.fillText('⚡ SPEED UP! Lv.' + (speedLevel), 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  // Collect popup
  if (collectPopupTimer > 0) {
    const a = collectPopupTimer > 40 ? 1 : collectPopupTimer / 40;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = 'bold 22px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillStyle = collectPopup.startsWith('+1 ') ? '#ff6688' :
                    collectPopup.startsWith('SH')  ? '#44ccff' :
                    collectPopup.startsWith('+10') ? '#aaffee' : '#ffe066';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 12;
    ctx.fillText(collectPopup, W / 2, H / 2 - 10);
    ctx.shadowBlur = 0;
    ctx.restore();
  }
} // end draw()

// ── Draw Collectible ────────────────────────────────────────────────────
function drawCollectible(c) {
  const bobOffset = Math.sin(c.bob) * 4;
  const cx = c.x + 11, cy = c.y + 11 + bobOffset;
  ctx.save();

  if (c.type === 'ufo') {
    drawCollectibleUfoIcon(cx, cy);
    ctx.restore();
    return;
  }

  if (c.type === 'heart') {
    ctx.shadowColor = '#ff4477'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff3366';
    // Draw a simple heart using two arcs + triangle
    ctx.beginPath();
    ctx.moveTo(cx, cy + 6);
    ctx.bezierCurveTo(cx - 11, cy - 2, cx - 11, cy - 10, cx, cy - 4);
    ctx.bezierCurveTo(cx + 11, cy - 10, cx + 11, cy - 2, cx, cy + 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,180,200,0.5)';
    ctx.beginPath(); ctx.arc(cx - 3, cy - 5, 3, 0, Math.PI * 2); ctx.fill();

  } else if (c.type === 'star') {
    ctx.shadowColor = '#ffee00'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffe033';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
      const r = i % 2 === 0 ? 10 : 4;
      const px = cx + Math.cos(angle) * r;
      const py = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,180,0.5)';
    ctx.beginPath(); ctx.arc(cx - 2, cy - 2, 2, 0, Math.PI * 2); ctx.fill();

  } else if (c.type === 'shield') {
    ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'rgba(40,140,255,0.85)';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 11);
    ctx.lineTo(cx + 9, cy - 5);
    ctx.lineTo(cx + 9, cy + 3);
    ctx.lineTo(cx, cy + 11);
    ctx.lineTo(cx - 9, cy + 3);
    ctx.lineTo(cx - 9, cy - 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(180,220,255,0.9)';
    ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText('★', cx, cy + 4);
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

// ── Draw UFO ─────────────────────────────────────────────────────────────
function drawUfo(x, y, phase) {
  ctx.save();
  // ── Tractor beam ──
  if (phase === UFO_STATE.BEAM || phase === UFO_STATE.HOLD) {
    const beamAlpha = 0.18 + 0.12 * Math.sin(Date.now() / 80);
    ctx.globalAlpha = beamAlpha;
    ctx.fillStyle = '#aaffcc';
    ctx.beginPath();
    ctx.moveTo(x + 4,  y + 28);
    ctx.lineTo(x + 36, y + 28);
    ctx.lineTo(x + 52, y + 90);
    ctx.lineTo(x - 12, y + 90);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ── Saucer body ──
  ctx.shadowColor = '#44ffaa'; ctx.shadowBlur = 18;
  // Bottom dome
  ctx.fillStyle = '#446688';
  ctx.beginPath();
  ctx.ellipse(x + 20, y + 22, 30, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // Top dome
  ctx.fillStyle = '#5588aa';
  ctx.beginPath();
  ctx.ellipse(x + 20, y + 16, 18, 12, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  // Glass top
  ctx.fillStyle = 'rgba(150,230,255,0.6)';
  ctx.beginPath();
  ctx.ellipse(x + 20, y + 15, 12, 8, 0, Math.PI, Math.PI * 2);
  ctx.fill();
  // Rim lights
  const litColors = ['#ff4444','#ffaa00','#44ff88','#44aaff'];
  for (let i = 0; i < 4; i++) {
    const ang = (i / 4) * Math.PI * 2 + Date.now() / 300;
    ctx.fillStyle = litColors[i];
    ctx.shadowColor = litColors[i]; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(x + 20 + Math.cos(ang) * 22, y + 22 + Math.sin(ang) * 6, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

// ── Draw Collectible (ufo type added) ───────────────────────────────────
function drawCollectibleUfoIcon(cx, cy) {
  ctx.shadowColor = '#44ffaa'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#446688';
  ctx.beginPath(); ctx.ellipse(cx, cy + 4, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#5599bb';
  ctx.beginPath(); ctx.ellipse(cx, cy, 8, 6, 0, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(150,230,255,0.7)';
  ctx.beginPath(); ctx.ellipse(cx, cy - 1, 5, 4, 0, Math.PI, Math.PI * 2); ctx.fill();
  // tiny beam hint
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#aaffcc';
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy + 4); ctx.lineTo(cx + 4, cy + 4);
  ctx.lineTo(cx + 7, cy + 13); ctx.lineTo(cx - 7, cy + 13);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// Draws a cat preview onto an arbitrary CanvasRenderingContext2D (for selector cards)
function drawCatOn(pCtx, x, y, type) {
  const C = CAT_SCHEMES[type] || CAT_SCHEMES.calico;
  const f = pCtx.fillRect.bind(pCtx);
  const s = (col) => { pCtx.fillStyle = col; };

  // Body
  s(C.body); f(x+4,y+12,30,22);
  if (type==='calico')  { s(C.p1);f(x+22,y+14,12,18); s(C.p2);f(x+5,y+24,12,10); }
  else if (type==='orange'){ s(C.p1);f(x+8,y+20,8,8); }
  else if (type==='ginger'){
    s(C.p1);f(x+8,y+20,8,8);
    s(C.p2);f(x+6,y+14,3,18);f(x+14,y+12,3,20);f(x+24,y+14,3,18);
  } else if (type==='tuxedo'){ s(C.p1);f(x+10,y+16,14,16); }
  else if (type==='grey')  { s(C.p1);f(x+8,y+16,9,12); }

  // Head
  s(C.body); f(x+10,y,22,20);
  if (type==='calico')  { s(C.p1);f(x+22,y+1,10,14); s(C.p2);f(x+10,y,8,7); }
  else if (type==='orange'){ s(C.p1);f(x+13,y+4,6,4); }
  else if (type==='ginger'){ s(C.p2);f(x+11,y+2,3,12);f(x+18,y,3,14);f(x+26,y+2,3,12); }
  else if (type==='tuxedo'){ s(C.p1);f(x+14,y+10,10,9); }

  // Ears
  const drawTri = (ax,ay,bx,by,cx2,cy2,col) => {
    pCtx.fillStyle=col;
    pCtx.beginPath();pCtx.moveTo(ax,ay);pCtx.lineTo(bx,by);pCtx.lineTo(cx2,cy2);pCtx.fill();
  };
  const earCol = type==='tuxedo'?'#1a1a1a':C.earL;
  drawTri(x+11,y+2, x+5,y-10, x+17,y+2, earCol);
  drawTri(x+23,y+2, x+29,y-10, x+35,y+2, type==='tuxedo'?'#1a1a1a':C.earR);
  const ie = type==='black'?'#553344':type==='grey'?'#cc9999':'#ff9999';
  drawTri(x+12,y+1, x+8,y-7, x+16,y+1, ie);
  drawTri(x+24,y+1, x+28,y-7, x+32,y+1, ie);

  // Eyes
  s('#000'); f(x+13,y+6,5,5); f(x+24,y+6,5,5);
  s(C.eye);  f(x+14,y+7,3,3); f(x+25,y+7,3,3);
  s('#000'); f(x+15,y+8,2,2); f(x+26,y+8,2,2);

  // Nose
  s(type==='black'?'#cc4488':'#ff6699'); f(x+19,y+13,4,3);

  // Tail
  pCtx.strokeStyle=C.tail; pCtx.lineWidth=4; pCtx.lineCap='round';
  pCtx.beginPath();
  pCtx.moveTo(x+4,y+26);
  pCtx.quadraticCurveTo(x-12,y+28,x-6,y+14);
  pCtx.stroke();
  pCtx.strokeStyle=C.tailTip;
  pCtx.beginPath();pCtx.moveTo(x-8,y+18);pCtx.lineTo(x-6,y+14);pCtx.stroke();

  // Legs
  s(C.body); f(x+8,y+32,8,8);
  s((type==='calico'||type==='tuxedo')?C.p1:C.body); f(x+22,y+32,8,8);
}

// ── Cat colour schemes ───────────────────────────────────────────────────────
const CAT_SCHEMES = {
  calico: { label:'Calico',    body:'#f5f0e8', p1:'#e8814a', p2:'#222',    earL:'#222',    earR:'#e8814a', eye:'#44ff88', tail:'#e8814a', tailTip:'#222'    },
  black:  { label:'Black',     body:'#1c1c1c', p1:'#141414', p2:'#111',    earL:'#1c1c1c', earR:'#1c1c1c', eye:'#ffee00', tail:'#1c1c1c', tailTip:'#111'    },
  orange: { label:'Orange',    body:'#e8702a', p1:'#c85a10', p2:'#b04808', earL:'#e8702a', earR:'#e8702a', eye:'#44ff88', tail:'#e8702a', tailTip:'#c85a10' },
  grey:   { label:'Grey',      body:'#aaaaaa', p1:'#777',    p2:'#555',    earL:'#888',    earR:'#888',    eye:'#66ddff', tail:'#999',    tailTip:'#555'    },
  tuxedo: { label:'Tuxedo',    body:'#1a1a1a', p1:'#f0f0f0', p2:'#111',    earL:'#1a1a1a', earR:'#1a1a1a', eye:'#44ff88', tail:'#1a1a1a', tailTip:'#eee'    },
  ginger: { label:'Ginger\nTabby', body:'#d4691e', p1:'#a03a00', p2:'#7a2a00', earL:'#d4691e', earR:'#d4691e', eye:'#aaee22', tail:'#d4691e', tailTip:'#a03a00' },
};
const CAT_ORDER = ['calico','black','orange','grey','tuxedo','ginger'];
// Now that all schemes and drawCatOn are defined, build the picker on load
attachCatListeners();

// ── Cat sprite (supports calico / black / orange) ────────────────────────────
function drawCat(x, y, frame, stunned) {
  ctx.save();
  if (stunned) ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now()/60);
  const C = CAT_SCHEMES[catType] || CAT_SCHEMES.calico;

  // Body
  ctx.fillStyle = C.body;
  ctx.fillRect(x+4, y+12, 30, 22);
  if (catType === 'calico') {
    ctx.fillStyle = C.p1; ctx.fillRect(x+22, y+14, 12, 18);
    ctx.fillStyle = C.p2; ctx.fillRect(x+5,  y+24, 12, 10);
  } else if (catType === 'orange') {
    ctx.fillStyle = C.p1; ctx.fillRect(x+8, y+20, 8, 8);
  }

  // Head
  ctx.fillStyle = C.body;
  ctx.fillRect(x+10, y, 22, 20);
  if (catType === 'calico') {
    ctx.fillStyle = C.p1; ctx.fillRect(x+22, y+1, 10, 14);
    ctx.fillStyle = C.p2; ctx.fillRect(x+10, y,    8,  7);
  } else if (catType === 'orange') {
    ctx.fillStyle = C.p1; ctx.fillRect(x+13, y+4, 6, 4);
  }

  // Ears
  ctx.fillStyle = C.earL;
  ctx.beginPath(); ctx.moveTo(x+11,y+2); ctx.lineTo(x+5, y-10); ctx.lineTo(x+17,y+2); ctx.fill();
  ctx.fillStyle = C.earR;
  ctx.beginPath(); ctx.moveTo(x+23,y+2); ctx.lineTo(x+29,y-10); ctx.lineTo(x+35,y+2); ctx.fill();
  ctx.fillStyle = catType === 'black' ? '#553344' : '#ff9999';
  ctx.beginPath(); ctx.moveTo(x+12,y+1); ctx.lineTo(x+8, y-7); ctx.lineTo(x+16,y+1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x+24,y+1); ctx.lineTo(x+28,y-7); ctx.lineTo(x+32,y+1); ctx.fill();

  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(x+13,y+6,5,5); ctx.fillRect(x+24,y+6,5,5);
  ctx.fillStyle = C.eye;
  ctx.fillRect(x+14,y+7,3,3); ctx.fillRect(x+25,y+7,3,3);
  ctx.fillStyle = '#000';
  ctx.fillRect(x+15,y+8,2,2); ctx.fillRect(x+26,y+8,2,2);

  // Nose & mouth
  ctx.fillStyle = catType === 'black' ? '#cc4488' : '#ff6699';
  ctx.fillRect(x+19,y+13,4,3);
  ctx.fillStyle = '#555';
  ctx.fillRect(x+18,y+16,2,2); ctx.fillRect(x+22,y+16,2,2);

  // Tail
  ctx.strokeStyle = C.tail; ctx.lineWidth = 4; ctx.lineCap = 'round';
  const tailWag = Math.sin(Date.now()/200) * 8;
  ctx.beginPath();
  ctx.moveTo(x+4, y+26);
  ctx.quadraticCurveTo(x-12, y+24+tailWag, x-6, y+10+tailWag);
  ctx.stroke();
  ctx.strokeStyle = C.tailTip;
  ctx.beginPath(); ctx.moveTo(x-8,y+14+tailWag); ctx.lineTo(x-6,y+10+tailWag); ctx.stroke();

  // Legs
  const legOff = frame * 5;
  ctx.fillStyle = C.body;  ctx.fillRect(x+8,  y+32, 8, 6+legOff);
  ctx.fillStyle = catType === 'calico' ? C.p1 : C.body;
  ctx.fillRect(x+22, y+32, 8, 6+(5-legOff));

  ctx.restore();
}

// ── Alien sprite ──────────────────────────────────────────────────────────────
function drawAlien(x, y, frame, stunned) {
  ctx.save();
  if (stunned) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now()/60);
    // Stars above when stunned
    ctx.font = '14px serif';
    ctx.fillText('★ ★ ★', x-4, y-8);
  }

  // Body (green)
  ctx.fillStyle = '#44dd55';
  ctx.beginPath();
  ctx.ellipse(x+20, y+28, 14, 16, 0, 0, Math.PI*2);
  ctx.fill();

  // Head (large dome)
  ctx.fillStyle = '#55ee66';
  ctx.beginPath();
  ctx.ellipse(x+20, y+12, 18, 16, 0, 0, Math.PI*2);
  ctx.fill();

  // Visor
  ctx.fillStyle = 'rgba(80,200,255,0.6)';
  ctx.beginPath();
  ctx.ellipse(x+20, y+11, 12, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // Big eyes behind visor
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x+14, y+11, 5, 7, -0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+26, y+11, 5, 7,  0.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff2266';
  ctx.beginPath(); ctx.arc(x+14, y+11, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+26, y+11, 2, 0, Math.PI*2); ctx.fill();

  // Antennae
  ctx.strokeStyle = '#44dd55';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x+14, y-2); ctx.lineTo(x+8,  y-14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+26, y-2); ctx.lineTo(x+32, y-14); ctx.stroke();
  ctx.fillStyle = '#ffff00';
  ctx.beginPath(); ctx.arc(x+8,  y-14, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+32, y-14, 3, 0, Math.PI*2); ctx.fill();

  // Arms
  ctx.strokeStyle = '#44dd55';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  const armSwing = Math.sin(Date.now()/300) * 10;
  ctx.beginPath(); ctx.moveTo(x+6,  y+24); ctx.lineTo(x-6,  y+32+armSwing); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+34, y+24); ctx.lineTo(x+44, y+32-armSwing); ctx.stroke();

  // Legs
  ctx.fillStyle = '#44dd55';
  const legOff = frame * 6;
  ctx.fillRect(x+11, y+40, 7, 8+legOff);
  ctx.fillRect(x+22, y+40, 7, 8+(6-legOff));

  ctx.restore();
}

// ── Mothman sprite ────────────────────────────────────────────────────────────
function drawMothman(x, y, frame, stunned) {
  ctx.save();
  if (stunned) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now()/60);
    ctx.font = '14px serif';
    ctx.fillText('✦ ✦ ✦', x-4, y-8);
  }

  // Wings (flapping)
  const wFlap = frame === 0 ? 0 : 12;
  ctx.fillStyle = 'rgba(60,0,80,0.9)';
  // Left wing
  ctx.beginPath();
  ctx.moveTo(x+22, y+14);
  ctx.bezierCurveTo(x+5, y-10+wFlap, x-18, y+wFlap, x-10, y+28);
  ctx.bezierCurveTo(x+4, y+32, x+14, y+24, x+22, y+14);
  ctx.fill();
  // Right wing
  ctx.beginPath();
  ctx.moveTo(x+22, y+14);
  ctx.bezierCurveTo(x+39, y-10+wFlap, x+62, y+wFlap, x+54, y+28);
  ctx.bezierCurveTo(x+40, y+32, x+30, y+24, x+22, y+14);
  ctx.fill();

  // Wing veins
  ctx.strokeStyle = 'rgba(120,40,160,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x+22,y+14); ctx.lineTo(x-8, y+20+wFlap/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+22,y+14); ctx.lineTo(x+52, y+20+wFlap/2); ctx.stroke();

  // Body
  ctx.fillStyle = '#2a0a2a';
  ctx.beginPath();
  ctx.ellipse(x+22, y+22, 10, 16, 0, 0, Math.PI*2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#3a1040';
  ctx.beginPath();
  ctx.ellipse(x+22, y+7, 10, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Glowing red eyes
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff1111';
  ctx.beginPath(); ctx.arc(x+17, y+6, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+27, y+6, 4, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffaaaa';
  ctx.beginPath(); ctx.arc(x+17, y+6, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+27, y+6, 1.5, 0, Math.PI*2); ctx.fill();

  // Feathery antennae
  ctx.strokeStyle = '#6a2080';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x+18, y-1); ctx.lineTo(x+12, y-12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+26, y-1); ctx.lineTo(x+32, y-12); ctx.stroke();
  // Feather tufts
  for (let i = 0; i < 3; i++) {
    ctx.beginPath(); ctx.moveTo(x+12-(i*2), y-12-(i*3)); ctx.lineTo(x+8-(i*2), y-10-(i*3)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+32+(i*2), y-12-(i*3)); ctx.lineTo(x+36+(i*2), y-10-(i*3)); ctx.stroke();
  }

  // Legs
  ctx.strokeStyle = '#2a0a2a';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x+16, y+34); ctx.lineTo(x+10, y+42); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+28, y+34); ctx.lineTo(x+34, y+42); ctx.stroke();

  ctx.restore();
}

// ─── Game Over ───────────────────────────────────────────────────────────────
function gameOver() {
  state = 'over';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h2 style="color:#a0f0ff">Caught! 😿</h2>
    <p style="color:#bbb;text-align:center">Score: <b style="color:#ffe066">${score}</b> &nbsp;·&nbsp; Pick a cat and go again!</p>
    <div id="cat-picker"></div>
    <button id="startBtn" style="padding:10px 24px;font-size:1rem;background:#1a8cff;color:#fff;border:none;border-radius:6px;cursor:pointer">Play Again</button>
  `;
  attachCatListeners();
  document.getElementById('startBtn').addEventListener('click', startGame);
}

// ─── Main Loop ───────────────────────────────────────────────────────────────
function loop() {
  if (state === 'playing') update();
  draw();
  raf = requestAnimationFrame(loop);
}

// Initial draw
makeStars();
draw();
</script>
